# Guests build with their own toolchain and release profile.
[workspace]
resolver = "3"
members = [
    "crates/curve-core",
    "crates/curve-math",
    "crates/factory-core",
    "crates/lbp-core",
    "crates/launchpad-client",
    "crates/pool",
    "crates/private-flow-core",
    "cli",
]
default-members = [
    "crates/curve-core",
    "crates/curve-math",
    "crates/factory-core",
    "crates/lbp-core",
    "crates/pool",
    "crates/private-flow-core",
]
exclude = [
    "methods",
    "methods/guest",
    "packages/lez-compat",
    "packages/weighted-math",
    "packages/launchpad/core/logic",
    "packages/launchpad/core/rust-lib",
]

[workspace.package]
edition = "2024"
rust-version = "1.94"

[workspace.dependencies]
lee = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "f94ca8a7550fa0012222b9fb5990dfe44c54a3dc" }
# Guests must not inherit the host feature.
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "f94ca8a7550fa0012222b9fb5990dfe44c54a3dc" }
wallet = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "f94ca8a7550fa0012222b9fb5990dfe44c54a3dc" }
common = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "f94ca8a7550fa0012222b9fb5990dfe44c54a3dc" }
sequencer_service_rpc = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "f94ca8a7550fa0012222b9fb5990dfe44c54a3dc", default-features = false, features = ["client"] }
clock_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "f94ca8a7550fa0012222b9fb5990dfe44c54a3dc" }
lez-compat-core = { path = "packages/lez-compat/core" }

curve-math = { path = "crates/curve-math" }
weighted-math-core = { path = "packages/weighted-math/crates/weighted-math-core" }
pool = { path = "crates/pool" }
curve-core = { path = "crates/curve-core" }
factory-core = { path = "crates/factory-core" }
lbp-core = { path = "crates/lbp-core" }
launchpad-client = { path = "crates/launchpad-client" }
private-flow-core = { path = "crates/private-flow-core" }

eyre = "0.6"
thiserror = "2"
strum = { version = "0.27", features = ["derive"] }
borsh = { version = "1.8", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
risc0-zkvm = { version = "3.0.5", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

# Keep arithmetic failures observable in release-mode property tests.
[profile.release]
overflow-checks = true
