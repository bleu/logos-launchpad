[package]
name = "launchpad_methods"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT"

[workspace]

[workspace.package]
edition = "2024"
rust-version = "1.94"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[lints]
workspace = true

[build-dependencies]
risc0-build = "3.0.5"

[dev-dependencies]
distribution-adapter = { path = "../crates/distribution-adapter" }
risc0-build = { version = "3.0.5", features = ["unstable"] }
risc0-binfmt = "3.0.5"
risc0-zkvm = { version = "3.0.5", default-features = false, features = ["client"] }
borsh = "1.6"
clock_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "578ce58a71b79c49d48e97e51c520bf71f0252d9" }
programs = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "578ce58a71b79c49d48e97e51c520bf71f0252d9", features = ["artifacts"] }
lee = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "578ce58a71b79c49d48e97e51c520bf71f0252d9" }
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "578ce58a71b79c49d48e97e51c520bf71f0252d9" }
curve-core = { path = "../crates/curve-core" }
factory-core = { path = "../crates/factory-core" }
lbp-core = { path = "../crates/lbp-core" }
pool = { path = "../crates/pool" }
lez-compat-core = { path = "../packages/lez-compat/core" }
lez-compat-methods = { path = "../packages/lez-compat/methods" }

[package.metadata.risc0]
methods = ["guest"]

[features]
overflow-tests = []
actor-execution-tests = []

[[test]]
name = "actor_sale"
required-features = ["actor-execution-tests"]

[[test]]
name = "release_overflow"
required-features = ["overflow-tests"]

[profile.release]
overflow-checks = true
