[package]
name = "launchpad_programs"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"

[workspace]

[workspace.package]
edition = "2024"
rust-version = "1.94"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[lints]
workspace = true

[dependencies]
lez-compat-core = { path = "../../packages/lez-compat/core" }
distribution-adapter = { path = "../../crates/distribution-adapter" }
borsh = "1.8"
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "cb075d5777cb812ba44216429d4f2837ea8518bd", default-features = false }
risc0-zkvm = { version = "3.1.0", default-features = false, features = ["std"] }

# Declared before it is used. This crate is its own workspace with its own lock, so
# nothing else proves that `curve-core` and everything under it compile for
# `riscv32im-risc0-zkvm-elf`. Cargo compiles declared dependencies whether they are
# referenced or not, which turns a host-feature leak into a build failure in this
# guest build.
curve-core = { path = "../../crates/curve-core" }
factory-core = { path = "../../crates/factory-core" }
lbp-core = { path = "../../crates/lbp-core" }
private-flow-core = { path = "../../crates/private-flow-core" }

# Part of program identity: the risc0 image ID is computed over the
# release-stripped binary, so every build that must reproduce a program id has
# to use this exact profile. Matches the lez-programs convention.
[profile.release]
debug = 0
strip = "symbols"
overflow-checks = true

[package.metadata.risc0]
rustc-flags = ["-Zremap-cwd-prefix=/source"]
