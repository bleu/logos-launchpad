name: Rust CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: Run full builds, client/CLI, guests and execution tests
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Light host tests, formatting and pins
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up pinned actor Rust
        run: |
          source verify/actor-tools.env
          rustup toolchain install "$ACTOR_RUST_VERSION" --profile minimal --component rustfmt
      - name: Check formatting
        run: |
          source verify/actor-tools.env
          for manifest in \
            Cargo.toml \
            methods/Cargo.toml \
            methods/guest/Cargo.toml \
            packages/lez-compat/Cargo.toml \
            packages/lez-compat/methods/Cargo.toml \
            packages/lez-compat/methods/guest/Cargo.toml \
            packages/lez-compat/execution/Cargo.toml \
            packages/weighted-math/Cargo.toml \
            packages/weighted-math/zkvm/Cargo.toml \
            packages/weighted-math/zkvm/methods/guest/Cargo.toml \
            packages/weighted-math/fuzz/Cargo.toml; do
            cargo +"$ACTOR_RUST_VERSION" fmt --manifest-path "$manifest" --all -- --check
          done
      - name: Set local test environment
        run: printf 'CURVE_EMERGENCY_AUTHORITY=%s\n' "$(< crates/curve-core/tests/fixtures/emergency-authority.hex)" >> "$GITHUB_ENV"
      - name: Check actor dependency pins and shell commands
        run: |
          bash verify/check-pins.sh
          bash verify/tests/actor-pins.sh --static
          bash verify/tests/application-pins.sh
          bash verify/tests/check-builds.sh
          bash verify/tests/check-builds.sh missing-artifacts
          bash verify/tests/check-dev.sh
      - name: Run light host tests
        run: bash verify/check-dev.sh
      - name: Check fixed and standalone role-authority addresses
        env:
          CARGO_PROFILE_DEV_DEBUG: 0
        run: bash verify/tests/check-role-authority-address.sh

  builds:
    name: Manual full builds, tests and IDL
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up pinned actor Rust
        run: |
          source verify/actor-tools.env
          rustup toolchain install "$ACTOR_RUST_VERSION" --profile minimal --component clippy
      - name: Set local test environment
        run: printf 'CURVE_EMERGENCY_AUTHORITY=%s\n' "$(< crates/curve-core/tests/fixtures/emergency-authority.hex)" >> "$GITHUB_ENV"
      - name: Install host prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libclang-dev libpcsclite-dev libssl-dev pkg-config python3-dev
      - name: Cache Cargo dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'verify/actor-tools.env', '**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-
      - name: Install pinned guest installer
        run: |
          source verify/build-tools.env
          tools="$RUNNER_TEMP/launchpad-tools"
          cargo install rzup --version "$RZUP_VERSION" --locked --root "$tools"
          printf '%s\n' "$HOME/.cargo/bin" "$tools/bin" >> "$GITHUB_PATH"
      - name: Install pinned guest toolchain
        run: |
          source verify/build-tools.env
          rzup install rust "$RISC0_RUST_VERSION"
          rzup install cpp "$RISC0_CPP_VERSION"
          rzup install r0vm "$RISC0_TOOLS_VERSION"
          rzup install cargo-risczero "$RISC0_TOOLS_VERSION"
          for binary in r0vm cargo-risczero; do
            executable="$(find "$HOME/.risc0/extensions" -type f -path "*/v$RISC0_TOOLS_VERSION-*/$binary" -print -quit)"
            test -n "$executable"
            dirname "$executable" >> "$GITHUB_PATH"
          done
      - name: Check installed tool versions
        run: bash verify/check-builds.sh --preflight
      - name: Check fuzz lockfile
        run: cargo metadata --manifest-path packages/weighted-math/fuzz/Cargo.toml --locked --format-version 1 > /dev/null
      - name: Check strict actor host lints
        run: |
          source verify/actor-tools.env
          cargo +"$ACTOR_RUST_VERSION" clippy --workspace --all-targets --locked -- -D warnings
          cargo +"$ACTOR_RUST_VERSION" clippy --manifest-path packages/lez-compat/Cargo.toml --workspace --all-targets --locked -- -D warnings
      - name: Check actor interface and wire commands
        run: |
          bash verify/tests/application-idl.sh
          bash verify/tests/application-idl-drift.sh
          bash verify/tests/actor-tools.sh
      - name: Run actor repository locked builds and tests
        run: bash verify/check-builds.sh --execution
      - name: Check generated actor program interfaces
        run: bash verify/check-idl.sh
