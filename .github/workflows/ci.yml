name: Rust CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Formatting and pins
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up pinned Rust
        run: |
          rustup show active-toolchain
          rustup component add rustfmt
      - name: Check formatting
        run: |
          for manifest in \
            Cargo.toml \
            methods/Cargo.toml \
            methods/guest/Cargo.toml \
            packages/weighted-math/Cargo.toml \
            packages/weighted-math/zkvm/Cargo.toml \
            packages/weighted-math/zkvm/methods/guest/Cargo.toml \
            packages/weighted-math/fuzz/Cargo.toml; do
            cargo fmt --manifest-path "$manifest" --all -- --check
          done
      - name: Check dependency pins
        run: bash verify/check-pins.sh

  builds:
    name: Locked builds, tests and IDL
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up pinned Rust
        run: rustup show active-toolchain
      - name: Set local test authority
        run: printf 'CURVE_EMERGENCY_AUTHORITY=%s\n' "$(< crates/curve-core/tests/fixtures/emergency-authority.hex)" >> "$GITHUB_ENV"
      - name: Install host prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libssl-dev pkg-config python3-dev
      - name: Cache Cargo dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'verify/build-tools.env', '**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-
      - name: Check fuzz lockfile
        run: cargo metadata --manifest-path packages/weighted-math/fuzz/Cargo.toml --locked --format-version 1 > /dev/null
      - name: Install pinned scaffold and guest installer
        run: |
          source verify/build-tools.env
          tools="$RUNNER_TEMP/launchpad-tools"
          cargo install rzup --version "$RZUP_VERSION" --locked --root "$tools"
          cargo install --git https://github.com/logos-co/scaffold.git --rev "$SCAFFOLD_REV" logos-scaffold --locked --root "$tools"
          printf '%s\n' "$HOME/.cargo/bin" "$tools/bin" >> "$GITHUB_PATH"
      - name: Install pinned guest toolchain
        run: |
          source verify/build-tools.env
          rzup install rust "$RISC0_RUST_VERSION"
          rzup install cpp "$RISC0_CPP_VERSION"
          rzup install r0vm "$RISC0_TOOLS_VERSION"
          rzup install cargo-risczero "$RISC0_TOOLS_VERSION"
      - name: Check installed tool versions
        run: bash verify/check-builds.sh --preflight
      - name: Check authority build inputs
        run: |
          bash verify/tests/check-emergency-authority.sh
          bash verify/tests/check-emergency-authority.sh authority-cache
      - name: Run locked builds and tests
        run: bash verify/check-builds.sh
      - name: Check generated program interfaces
        run: bash verify/check-idl.sh
