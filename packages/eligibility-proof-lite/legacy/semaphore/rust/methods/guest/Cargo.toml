[package]
name = "eligibility-lite-guest"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"

[workspace]

[dependencies]
borsh = "=1.6.1"
eligibility-proof-verifier = { path = "../../verifier" }
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "578ce58a71b79c49d48e97e51c520bf71f0252d9" }
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"

[profile.release]
overflow-checks = true
