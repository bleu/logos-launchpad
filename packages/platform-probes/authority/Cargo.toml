[workspace]
members = ["."]
exclude = ["methods"]
resolver = "2"

[package]
name = "authority-probe"
version = "0.1.0"
edition = "2024"
publish = false

[features]
guest-tests = ["dep:risc0-zkvm", "dep:lee_core"]

[[test]]
name = "authority_guest"
required-features = ["guest-tests"]

[dependencies]
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["client"], optional = true }
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.4", optional = true }
borsh = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
admin-authority = { git = "https://github.com/mmlado/spel-admin-authority.git", tag = "v0.1.4" }
freeze-authority = { git = "https://github.com/mmlado/spel-freeze-authority.git", rev = "a4743468bd3a87093931c48c965cc084aa4690c3" }
spel-framework = { git = "https://github.com/logos-co/spel.git", rev = "d0bb659048c3fc6533f51c69e9f7f12382af6dd2" }

[profile.release]
overflow-checks = true
