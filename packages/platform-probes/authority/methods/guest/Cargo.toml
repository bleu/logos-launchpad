[package]
name = "authority-probe-guest"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
spel-framework = { git = "https://github.com/logos-co/spel.git", rev = "d0bb659048c3fc6533f51c69e9f7f12382af6dd2" }
authority-probe = { path = "../.." }
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std"] }

[profile.release]
debug = 0
strip = "symbols"
overflow-checks = true

[package.metadata.risc0]
rustc-flags = ["-Zremap-cwd-prefix=/source"]
