[workspace]
resolver = "3"
members = ["core", "tools"]
exclude = ["methods", "methods/guest", "execution"]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
clock_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "cb075d5777cb812ba44216429d4f2837ea8518bd" }
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "cb075d5777cb812ba44216429d4f2837ea8518bd" }
borsh = { version = "1.6", features = ["derive"] }
lez-compat-core = { path = "core" }
risc0-zkvm = { version = "=3.1.0", default-features = false, features = ["std"] }

[profile.release]
overflow-checks = true
