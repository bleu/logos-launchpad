# Separate workspace: the RISC0 guest build and its host runner. It has distinct
# dependencies and build tooling. Math host checks do not compile RISC0 crates.
#
# Build/run (needs `rzup install`, see zkvm/README.md):
#   cd zkvm && cargo run --release
[workspace]
resolver = "2"
members = ["host", "methods"]

[workspace.package]
edition = "2024"
rust-version = "1.94"
license = "MIT"

[profile.release]
# Match the root workspace: financial math panics on overflow, never wraps.
# The guest is its own workspace (methods/guest) with the same setting.
overflow-checks = true

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
