[workspace]
resolver = "3"
members = ["crates/eligibility-core"]
exclude = ["zkvm", "zkvm/methods/guest"]

[workspace.package]
edition = "2024"
rust-version = "1.94"
license = "MIT"

[workspace.dependencies]
ark-bn254 = { version = "=0.5.0", default-features = false, features = ["scalar_field"] }
ark-ff = { version = "=0.5.0", default-features = false }
light-poseidon = "=0.4.0"
serde = { version = "1", features = ["derive"] }
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std"] }
k256 = { version = "=0.13.4", default-features = false, features = ["arithmetic", "schnorr", "std"] }
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "a58fbce2ff48c58b7bb5001b1a27e64b9596ee3a" }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
overflow-checks = true
